[package]
name = "aether-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.10"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
aether-db = { path = "../aether-db" }
aether-mcp = { path = "../aether-mcp" }
aether-permissions = { path = "../aether-permissions" }
aether-skills = { path = "../aether-skills" }
aether-sandbox = { path = "../aether-sandbox" }
keyring = { version = "3.6", features = ["apple-native"] }
sha2 = "0.10"

[dev-dependencies]
aether-db = { path = "../aether-db" }
