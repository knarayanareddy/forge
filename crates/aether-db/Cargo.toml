[package]
name = "aether-db"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "consolidate-memory"
path = "src/bin/consolidate-memory.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.38", features = ["full"] }

[dev-dependencies]
tempfile = "3.10"
