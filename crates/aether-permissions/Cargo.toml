[package]
name = "aether-permissions"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regex = "1.10"
thiserror = "2.0"
aether-db = { path = "../aether-db" }
aether-sandbox = { path = "../aether-sandbox" }

[dev-dependencies]
tempfile = "3.10"
