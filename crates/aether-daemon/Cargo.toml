[package]
name = "aether-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aether-daemon"
path = "src/main.rs"

[[example]]
name = "stream_client"
path = "examples/stream_client.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
aether-core = { path = "../aether-core" }
aether-db = { path = "../aether-db" }
aether-permissions = { path = "../aether-permissions" }
