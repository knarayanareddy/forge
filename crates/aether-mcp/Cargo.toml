[package]
name = "aether-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aether-forge-mcp"
path = "src/bin/aether-forge-mcp.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.38", features = ["full"] }
aether-permissions = { path = "../aether-permissions" }
aether-sandbox = { path = "../aether-sandbox" }
rusqlite = { version = "0.31", features = ["bundled"] }
