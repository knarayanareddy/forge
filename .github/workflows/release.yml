name: Release
on:
  workflow_dispatch:
    inputs:
      version: { description: "Release version", required: true, default: "0.1.0" }
      sign: { description: "Developer ID signing (Keychain cert required)", type: boolean, default: false }
      notarize: { description: "Notarize after signing", type: boolean, default: false }
jobs:
  build-dmg:
    runs-on: macos-15
    env:
      AETHER_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          AETHER_SIGN=${{ inputs.sign && '1' || '0' }} ./scripts/create-dmg.sh
      - if: inputs.notarize
        run: ./scripts/notarize.sh "build/dmg/AetherForge-${AETHER_VERSION}.dmg" "build/dmg/staging/AetherForge.app"
      - run: |
          DMG="build/dmg/AetherForge-${AETHER_VERSION}.dmg"
          [[ "${{ inputs.sign }}" == "true" ]] && export AETHER_REQUIRE_SIGNED=1
          [[ "${{ inputs.notarize }}" == "true" ]] && export AETHER_REQUIRE_NOTARIZED=1
          ./scripts/verify-codesign.sh "$DMG"
      - run: ./scripts/dist01-smoke.sh
      - run: grep -q sparkle:edSignature packaging/sparkle/appcast.xml.template
      - uses: actions/upload-artifact@v4
        with:
          name: aetherforge-dmg-${{ inputs.version }}
          path: |
            build/dmg/AetherForge-${{ inputs.version }}.dmg
            build/dmg/AetherForge-${{ inputs.version }}.sha256
          if-no-files-found: error
