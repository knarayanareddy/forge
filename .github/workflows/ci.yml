name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly Darwin full harness gate (06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@localhost
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node (MCP harness)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP filesystem server
        run: npm install -g @modelcontextprotocol/server-filesystem

      - name: Scan MCP allowlist (static gate)
        run: chmod +x scripts/scan-mcp-allowlist.sh && ./scripts/scan-mcp-allowlist.sh

      - name: Check scoreboard and threshold docs
        run: bash scripts/check-doc-scoreboard.sh

      - name: Build workspace
        run: cargo build --workspace

      - name: Unit tests
        run: cargo test --workspace

      - name: Golden harness (Linux fail-closed matrix)
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
        run: |
          set +e
          cargo run -p golden-harness 2>&1 | tee harness.log
          PASS=$(grep 'Passed:' harness.log | tail -1 | sed -E 's/.*Passed: ([0-9]+).*/\1/')
          HARD=$(grep 'Hard green:' harness.log | tail -1 | sed -E 's/.*Hard green: ([0-9]+).*/\1/')
          echo "Harness passed: ${PASS:-0}/31 (${HARD:-0} hard)"
          if [[ "${PASS:-0}" -lt 23 ]]; then
            echo "Expected at least 23/31 on Linux (FS-02, SB-01, MEM-01, ROUT-01, GRAPH-01, LOOP-02, PLAN-01, LOOP-04 fail-closed without Darwin/Ollama)"
            exit 1
          fi

  darwin-pr-fast:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node (MCP harness)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP filesystem server
        run: npm install -g @modelcontextprotocol/server-filesystem

      - name: Scan MCP allowlist (static gate)
        run: chmod +x scripts/scan-mcp-allowlist.sh && ./scripts/scan-mcp-allowlist.sh

      - name: Check scoreboard and threshold docs
        run: bash scripts/check-doc-scoreboard.sh

      - name: Build workspace
        run: cargo build --workspace

      - name: Unit tests
        run: cargo test --workspace

      - name: Swift build
        run: |
          ./scripts/build-ffi.sh
          swift build

  darwin-full:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node (MCP harness)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP filesystem server
        run: npm install -g @modelcontextprotocol/server-filesystem

      - name: Scan MCP allowlist (static gate)
        run: chmod +x scripts/scan-mcp-allowlist.sh && ./scripts/scan-mcp-allowlist.sh

      - name: Check scoreboard and threshold docs
        run: bash scripts/check-doc-scoreboard.sh

      - name: Install Ollama models
        run: |
          brew install ollama || true
          ollama serve &
          sleep 5
          ollama pull all-minilm
          ollama pull qwen2.5:3b

      - name: Warm Ollama models (ROUT-01 / MEM-01 / GRAPH-01)
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            curl -sf http://localhost:11434/api/chat \
              -d '{"model":"qwen2.5:3b","messages":[{"role":"user","content":"forge"}],"stream":true,"keep_alive":"30m","options":{"num_predict":8,"num_ctx":512,"temperature":0}}' \
              --no-buffer -o /dev/null
          done
          curl -sf http://localhost:11434/api/embeddings \
            -d '{"model":"all-minilm","prompt":"forge embed warmup"}' \
            -o /dev/null
          curl -sf http://localhost:11434/api/embeddings \
            -d '{"model":"all-minilm","prompt":"forge embed warmup"}' \
            -o /dev/null

      - name: Build workspace
        run: cargo build --workspace

      - name: Golden harness (Darwin canonical 31/31)
        env:
          # macos-15 GHA runners vary 300–550ms warm server TTFT; 550ms avoids flake on slow VMs.
          AETHER_ROUT_TTFT_MS: "550"
        run: |
          set -e
          cargo run -p golden-harness 2>&1 | tee harness.log
          PASS=$(grep 'Passed:' harness.log | tail -1 | sed -E 's/.*Passed: ([0-9]+).*/\1/')
          HARD=$(grep 'Hard green:' harness.log | tail -1 | sed -E 's/.*Hard green: ([0-9]+).*/\1/')
          echo "Harness passed: ${PASS:-0}/31 (${HARD:-0} hard)"
          if [[ "${PASS:-0}" -ne 31 || "${HARD:-0}" -ne 31 ]]; then
            echo "Darwin canonical gate requires 31/31 (31 hard / 0 soft)"
            exit 1
          fi

      - name: Swift build
        run: |
          ./scripts/build-ffi.sh
          swift build
