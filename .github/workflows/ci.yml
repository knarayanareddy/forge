name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly Darwin full harness gate (06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node (MCP harness)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP filesystem server
        run: npm install -g @modelcontextprotocol/server-filesystem

      - name: Scan MCP allowlist (static gate)
        run: chmod +x scripts/scan-mcp-allowlist.sh && ./scripts/scan-mcp-allowlist.sh

      - name: Build workspace
        run: cargo build --workspace

      - name: Unit tests
        run: cargo test --workspace

      - name: Golden harness (Linux fail-closed matrix)
        run: |
          set +e
          cargo run -p golden-harness 2>&1 | tee harness.log
          PASS=$(grep -oP 'Passed: \K[0-9]+' harness.log | tail -1)
          HARD=$(grep -oP 'Hard green: \K[0-9]+' harness.log | tail -1)
          echo "Harness passed: ${PASS:-0}/17 (${HARD:-0} hard)"
          if [[ "${PASS:-0}" -lt 12 ]]; then
            echo "Expected at least 12/17 on Linux (FS-02, MEM-01, ROUT-01, GRAPH-01, LOOP-02 fail-closed)"
            exit 1
          fi

  darwin-pr-fast:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node (MCP harness)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP filesystem server
        run: npm install -g @modelcontextprotocol/server-filesystem

      - name: Scan MCP allowlist (static gate)
        run: chmod +x scripts/scan-mcp-allowlist.sh && ./scripts/scan-mcp-allowlist.sh

      - name: Build workspace
        run: cargo build --workspace

      - name: Unit tests
        run: cargo test --workspace

      - name: Swift build
        run: |
          ./scripts/build-ffi.sh
          swift build

  darwin-full:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node (MCP harness)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP filesystem server
        run: npm install -g @modelcontextprotocol/server-filesystem

      - name: Scan MCP allowlist (static gate)
        run: chmod +x scripts/scan-mcp-allowlist.sh && ./scripts/scan-mcp-allowlist.sh

      - name: Install Ollama models
        run: |
          brew install ollama || true
          ollama serve &
          sleep 5
          ollama pull all-minilm
          ollama pull qwen2.5:3b

      - name: Warm Ollama chat model (ROUT-01)
        run: |
          for i in 1 2 3; do
            curl -sf http://localhost:11434/api/chat \
              -d '{"model":"qwen2.5:3b","messages":[{"role":"user","content":"forge"}],"stream":true,"keep_alive":"30m","options":{"num_predict":8,"temperature":0}}' \
              --no-buffer -o /dev/null
          done

      - name: Build workspace
        run: cargo build --workspace

      - name: Golden harness (Darwin canonical 17/17)
        run: |
          set -e
          cargo run -p golden-harness 2>&1 | tee harness.log
          PASS=$(grep -oP 'Passed: \K[0-9]+' harness.log | tail -1)
          HARD=$(grep -oP 'Hard green: \K[0-9]+' harness.log | tail -1)
          echo "Harness passed: ${PASS:-0}/17 (${HARD:-0} hard)"
          if [[ "${PASS:-0}" -ne 17 || "${HARD:-0}" -ne 17 ]]; then
            echo "Darwin canonical gate requires 17/17 (17 hard / 0 soft)"
            exit 1
          fi

      - name: Swift build
        run: |
          ./scripts/build-ffi.sh
          swift build
