[package]
name = "golden-harness"
version = "0.1.0"
edition = "2021"
default-run = "golden-harness"

[[bin]]
name = "res-crash-child"
path = "src/bin/res_crash_child.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
sha2 = "0.10"
futures = "0.3"
libc = "0.2"
aether-db = { path = "../../crates/aether-db" }
aether-mcp = { path = "../../crates/aether-mcp" }
aether-sandbox = { path = "../../crates/aether-sandbox" }
aether-permissions = { path = "../../crates/aether-permissions" }
aether-core = { path = "../../crates/aether-core" }
aether-skills = { path = "../../crates/aether-skills" }
aether-daemon = { path = "../../crates/aether-daemon" }

[[test]]
name = "skill03_harness"
path = "tests/skill03_harness.rs"

[[test]]
name = "inject01_harness"
path = "tests/inject01_harness.rs"

[[test]]
name = "ingest01_harness"
path = "tests/ingest01_harness.rs"
